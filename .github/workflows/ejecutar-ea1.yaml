name: Ejecutar EA1

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-ea1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y resultados generados
        run: |
          mkdir -p EA1/datos EA1/resultados
          find EA1/datos -mindepth 1 -delete
          find EA1/resultados -mindepth 1 -delete

      - name: Ejecutar EA1_fake_news.ipynb
        working-directory: EA1/notebooks
        run: |
          source ../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            EA1_fake_news.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EA1/datos EA1/resultados EA1/notebooks/EA1_fake_news.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          # Identificar el commit que disparó la ejecución.
          # En un merge de PR se usa el título del PR (primera línea del cuerpo).
          ORIGEN=$(git rev-parse --short "$GITHUB_SHA")
          if git rev-parse -q --verify "${GITHUB_SHA}^2" > /dev/null; then
            TITULO=$(git log -1 --format=%b "$GITHUB_SHA" | head -n 1)
          else
            TITULO=$(git log -1 --format=%s "$GITHUB_SHA")
          fi

          REPORTE=EA1/resultados/fake-news.txt
          FILAS=$(grep -m 1 '^Filas:' "$REPORTE" || echo "Filas: ?")
          COLUMNAS=$(grep -m 1 '^Columnas:' "$REPORTE" || echo "Columnas: ?")

          git commit \
            -m "chore: regenerar resultados de la EA1 tras ${ORIGEN} [skip ci]" \
            -m "Disparado por: ${TITULO}" \
            -m "Reporte: ${FILAS} | ${COLUMNAS}"
          git push origin HEAD:main
